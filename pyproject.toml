[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "humaniser"
version = "0.1.0"
description = "Document Style Transformation Platform — optimizing compiler architecture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mistune>=3.0",
    "TexSoup>=0.3.0",
    "textstat>=0.7.0",
    "spacy>=3.0",
    "google-generativeai>=0.3.0",
    "sentence-transformers>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
